<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<title>Snap Answer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root {
  --bg: #0f1216; --panel: #181d23; --line: #2a313a; --fg: #e9edf1; --muted: #8b96a3;
  --accent: #ffb547; --accent-ink: #1a1206; --bad: #ff7a6b;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body);
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  display: flex; flex-direction: column; gap: 14px; max-width: 560px; margin: 0 auto;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font: 700 20px var(--display); letter-spacing: .04em; margin: 0; text-transform: uppercase; }
h1 span { color: var(--accent); }
.mode { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.mode button { font: 500 13px var(--display); letter-spacing: .06em; text-transform: uppercase; background: none; color: var(--muted); border: 0; padding: 6px 12px; }
.mode button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.label { font: 500 11px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
#answer { font: 700 30px/1.2 var(--display); overflow-wrap: anywhere; }
#answer.idle { color: var(--muted); font-size: 20px; font-weight: 500; }
#answer.err { color: var(--bad); font-size: 18px; }
#why { color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.thinking::after { content: ""; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
#shot { display: flex; gap: 12px; align-items: center; }
#thumb { width: 72px; height: 54px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
#shotMeta { color: var(--muted); font-size: 13px; }
details { color: var(--muted); font-size: 14px; }
#note { width: 100%; margin-top: 8px; min-height: 56px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 15px var(--body); }
.dock { margin-top: auto; position: sticky; bottom: 0; padding: 12px 0 calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; gap: 10px; }
.shutter { flex: 1; min-height: 80px; border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-ink); font: 700 22px var(--display); letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 12px; }
.shutter:active { transform: scale(.98); }
.shutter:disabled { opacity: .55; }
.ghost { min-width: 80px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: 500 13px var(--display); letter-spacing: .06em; text-transform: uppercase; }
.ghost:disabled { opacity: .4; }
.lens { width: 26px; height: 26px; border: 3px solid currentColor; border-radius: 50%; position: relative; }
.lens::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: currentColor; }
</style>
</head>
<body>
<header>
  <h1>Snap<span>/</span>Answer</h1>
  <div class="mode" role="group" aria-label="Speed">
    <button id="modeFast" type="button" aria-pressed="true">Fast</button>
    <button id="modeSmart" type="button" aria-pressed="false">Smart</button>
  </div>
</header>

<section class="card" aria-live="polite">
  <div class="label"><span>Answer</span><span id="time"></span></div>
  <div id="answer" class="idle">Point your phone at the game screen and tap Snap.</div>
  <div id="why"></div>
</section>

<section class="card" id="shotCard" hidden>
  <div class="label">Last photo</div>
  <div id="shot"><img id="thumb" alt="Last photo taken"><div id="shotMeta"></div></div>
</section>

<details>
  <summary>Extra instructions (optional)</summary>
  <textarea id="note" placeholder="e.g. It's a riddle game, answer in one word"></textarea>
</details>

<div class="dock">
  <button class="ghost" id="again" type="button" disabled>Ask again</button>
  <button class="shutter" id="snap" type="button"><span class="lens" aria-hidden="true"></span>Snap</button>
</div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>

<script>
const $ = (id) => document.getElementById(id);
const answerEl = $("answer"), whyEl = $("why"), snapBtn = $("snap"), againBtn = $("again"), cam = $("cam");
let mode = "fast", lastBlob = null, busy = false;

function setMode(m) {
  mode = m;
  $("modeFast").setAttribute("aria-pressed", m === "fast");
  $("modeSmart").setAttribute("aria-pressed", m === "smart");
  try { localStorage.setItem("snapMode", m); } catch (e) {}
}
try { if (localStorage.getItem("snapMode") === "smart") setMode("smart"); } catch (e) {}
$("modeFast").onclick = () => setMode("fast");
$("modeSmart").onclick = () => setMode("smart");

snapBtn.onclick = () => { cam.value = ""; cam.click(); };
againBtn.onclick = () => lastBlob && ask(lastBlob);
cam.onchange = async () => {
  const f = cam.files && cam.files[0];
  if (!f) return;
  show("Sending", "", "thinking");
  lastBlob = await shrink(f);
  $("thumb").src = URL.createObjectURL(lastBlob);
  $("shotMeta").textContent = new Date().toLocaleTimeString() + " · " + Math.round(lastBlob.size / 1024) + " KB";
  $("shotCard").hidden = false;
  againBtn.disabled = false;
  ask(lastBlob);
};

// Downscale big phone photos so the upload is quick
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((r) => c.toBlob((b) => r(b || file), "image/jpeg", 0.85));
  } catch (e) { return file; }
}

function show(a, why, cls) {
  answerEl.className = cls || "";
  answerEl.textContent = a;
  whyEl.textContent = why;
}

async function ask(blob) {
  if (busy) return;
  busy = true; snapBtn.disabled = true; againBtn.disabled = true;
  $("time").textContent = "";
  show("Thinking", "", "thinking");
  const t0 = performance.now();
  try {
    const qs = new URLSearchParams({ mode, note: $("note").value.trim() });
    const res = await fetch("/ask?" + qs, { method: "POST", body: blob, headers: { "Content-Type": "image/jpeg" } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Server error " + res.status);
    const t = (data.answer || "").trim(), i = t.indexOf("\n");
    show(i < 0 ? t : t.slice(0, i), i < 0 ? "" : t.slice(i + 1).trim());
    $("time").textContent = ((performance.now() - t0) / 1000).toFixed(1) + "s";
    if (navigator.vibrate) navigator.vibrate(80);
  } catch (e) {
    show("Couldn't get an answer", e.message + "\nTap Ask again.", "err");
  } finally {
    busy = false; snapBtn.disabled = false; againBtn.disabled = false;
  }
}
</script>
</body>
</html>
